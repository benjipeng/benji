<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A garden in a roundel, composed like the page: a frangipani branch reaches in from the
       left with a flower, a mango branch from the right with a ripening fruit, and monstera, a
       bird of paradise paddle, and a fan palm rise from below around an open clearing. Colors
       are the garden's day tokens. Dark browser themes get the night paper and pale ink. -->
  <style>
    .paper { fill: #f2f2ed; }
    .ink { fill: none; stroke: #1f2a1c; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #131712; }
      .ink { stroke: #ced4bf; }
    }
  </style>
  <defs>
    <clipPath id="disc"><circle cx="32" cy="32" r="30" /></clipPath>
    <path id="petal" d="M0 0C1.6-1.9 5.8-2.6 7.4-.8 8.2.6 6.6 2.2 3.6 2.1 1.8 2 .6 1.2 0 0Z" />
  </defs>
  <circle class="paper" cx="32" cy="32" r="30" />
  <g clip-path="url(#disc)">
    <!-- Bird of paradise paddle, standing at the back of the bed -->
    <g transform="translate(37 70) rotate(-4)">
      <path d="M0 0V-16" fill="none" stroke="#428369" stroke-width="1.8" stroke-linecap="round" />
      <path d="M0-14C-5.4-19-5.4-32 0-38 5.4-32 5.4-19 0-14Z" fill="#428369" />
      <path class="ink" d="M0-14C-5.4-19-5.4-32 0-38 5.4-32 5.4-19 0-14ZM0-15V-35" stroke-width="0.8" />
    </g>
    <!-- Fan palm, right of the bed -->
    <g transform="translate(51 61) rotate(8)">
      <path d="M0 0V6" fill="none" stroke="#6f8c48" stroke-width="1.8" stroke-linecap="round" />
      <path d="M0 0-12-7C-10-17 5-21 12-11Z" fill="#6b9544" />
      <path class="ink" d="M0 0-12-7C-10-17 5-21 12-11ZM0 0-7.5-15M0 0-1-17.5M0 0 5.5-15.5" stroke-width="0.8" />
    </g>
    <!-- Monstera, left of the bed -->
    <g transform="translate(15 58) rotate(-20) scale(0.72)">
      <path d="M0 0V8" fill="none" stroke="#6f8c48" stroke-width="2.4" stroke-linecap="round" />
      <path d="M0 0C-4 3-16 2-17-8-18-18-9-25 0-27 9-25 18-18 17-8 16 2 4 3 0 0Z" fill="#267543" />
      <path class="ink" d="M0 0C-4 3-16 2-17-8-18-18-9-25 0-27 9-25 18-18 17-8 16 2 4 3 0 0ZM0 0V-24M0-6-11-10M0-13-10-19M0-6 11-10M0-13 10-19" stroke-width="1.1" />
    </g>
    <!-- Frangipani branch from the left: a rosette of leaves and one flower -->
    <path d="M-2 25C5 24 11 23 17 20" fill="none" stroke="#95947f" stroke-width="3.4" stroke-linecap="round" />
    <path class="ink" d="M-2 26.6C5 25.6 11 24.6 17.6 21.6" stroke-width="0.7" />
    <g fill="#428249">
      <path d="M17 20C13 16 12 10 15 6 18 10 19 15 17 20Z" />
      <path d="M17 20C20 15 25 13 30 13 27 18 22 20 17 20Z" />
      <path d="M17 20C21 20 25 23 27 27 22 27 19 24 17 20Z" />
    </g>
    <path class="ink" d="M17 20C13 16 12 10 15 6 18 10 19 15 17 20ZM17 20C20 15 25 13 30 13 27 18 22 20 17 20ZM17 20C21 20 25 23 27 27 22 27 19 24 17 20Z" stroke-width="0.75" />
    <g transform="translate(21 11)">
      <g fill="#f9f5e6">
        <use href="#petal" transform="rotate(-10)" />
        <use href="#petal" transform="rotate(62)" />
        <use href="#petal" transform="rotate(134)" />
        <use href="#petal" transform="rotate(206)" />
        <use href="#petal" transform="rotate(278)" />
      </g>
      <g class="ink" stroke-width="0.55">
        <use href="#petal" transform="rotate(-10)" />
        <use href="#petal" transform="rotate(62)" />
        <use href="#petal" transform="rotate(134)" />
        <use href="#petal" transform="rotate(206)" />
        <use href="#petal" transform="rotate(278)" />
      </g>
      <circle r="1.9" fill="#f3c443" />
    </g>
    <!-- Mango branch from the right: drooping leaves and one fruit -->
    <path d="M66 22C59 22 53 24 47 28" fill="none" stroke="#706052" stroke-width="2.8" stroke-linecap="round" />
    <path class="ink" d="M66 23.4C59 23.4 53.4 25.4 47.6 29.2" stroke-width="0.7" />
    <g fill="#2f5e42">
      <path d="M47 28C42 29 38 33 36 38 41 37 45 33 47 28Z" />
      <path d="M47 28C46 33 47 38 50 42 52 37 51 32 47 28Z" />
      <path d="M47 28C44 25 39 24 35 25 38 29 43 30 47 28Z" />
    </g>
    <path class="ink" d="M47 28C42 29 38 33 36 38 41 37 45 33 47 28ZM47 28C46 33 47 38 50 42 52 37 51 32 47 28ZM47 28C44 25 39 24 35 25 38 29 43 30 47 28Z" stroke-width="0.75" />
    <path class="ink" d="M55 25.6C55.6 29 56 31 56.4 33" stroke-width="0.6" />
    <path d="M56.4 33C59.6 33 61 36.4 60.4 40.4 59.8 44 57.6 45.6 55.6 45 53.4 44.4 53 41.2 53.6 38 54.2 35 54.8 33.2 56.4 33Z" fill="#eabe4a" />
    <path d="M58.6 35.4C60.2 37.4 60.4 40.4 59.6 42.4 58 41 57.4 38 58.6 35.4Z" fill="#e9884d" fill-opacity="0.55" />
    <path class="ink" d="M56.4 33C59.6 33 61 36.4 60.4 40.4 59.8 44 57.6 45.6 55.6 45 53.4 44.4 53 41.2 53.6 38 54.2 35 54.8 33.2 56.4 33Z" stroke-width="0.7" />
  </g>
  <circle class="ink" cx="32" cy="32" r="30" stroke-width="1.4" />
</svg>
